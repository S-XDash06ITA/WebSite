<style>

#snakeWindow{
    display:none;
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    background:#C0C0C0;
    border:3px outset white;
    padding:10px;
    z-index:9999;
}

#snakeTitle{
    background:#003399;
    color:white;
    padding:5px;
    font-weight:bold;
    margin-bottom:10px;
}

#snakeTitle button{
    float:right;
}

#snake{
    background:black;
    display:block;
}

</style>

<script>

function openSnake(){
    document.getElementById("snakeWindow").style.display="block";
}

function closeSnake(){
    document.getElementById("snakeWindow").style.display="none";
}

const canvas=document.getElementById("snake");
const ctx=canvas.getContext("2d");

let snake=[
{x:10,y:10}
];

let food={
x:15,
y:15
};

let dx=1;
let dy=0;

document.addEventListener("keydown",e=>{

if(e.key=="ArrowUp" && dy==0){
dx=0;dy=-1;
}

if(e.key=="ArrowDown" && dy==0){
dx=0;dy=1;
}

if(e.key=="ArrowLeft" && dx==0){
dx=-1;dy=0;
}

if(e.key=="ArrowRight" && dx==0){
dx=1;dy=0;
}

});

function draw(){

ctx.fillStyle="black";
ctx.fillRect(0,0,400,400);

ctx.fillStyle="lime";

snake.forEach(s=>{
ctx.fillRect(s.x*20,s.y*20,18,18);
});

ctx.fillStyle="red";
ctx.fillRect(food.x*20,food.y*20,18,18);

const head={
x:snake[0].x+dx,
y:snake[0].y+dy
};

if(head.x<0)head.x=19;
if(head.x>19)head.x=0;
if(head.y<0)head.y=19;
if(head.y>19)head.y=0;

snake.unshift(head);

if(head.x==food.x && head.y==food.y){

food.x=Math.floor(Math.random()*20);
food.y=Math.floor(Math.random()*20);

}else{

snake.pop();

}

for(let i=1;i<snake.length;i++){

if(head.x==snake[i].x && head.y==snake[i].y){

snake=[{x:10,y:10}];
dx=1;
dy=0;

}

}

}

setInterval(draw,120);

</script>
